<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Vibranium Suit Weave -->
    <radialGradient id="pantherSuit" cx="44%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#363c47"/>
      <stop offset="45%" stop-color="#1c1f24"/>
      <stop offset="85%" stop-color="#0f1114"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Kinetic Purple Energy Core -->
    <radialGradient id="kineticEnergy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#df8aff"/>
      <stop offset="70%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#3c096c"/>
    </radialGradient>

    <!-- Silver Vibranium Claws -->
    <linearGradient id="silverClaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfd8e3"/>
      <stop offset="80%" stop-color="#7a8799"/>
      <stop offset="100%" stop-color="#333b45"/>
    </linearGradient>

    <filter id="kineticGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panther3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#panther3DShadow)">
    <!-- 1. RAISED VIBRANIUM ARMORED ARM & CLAWED GAUNTLET AT (cx=65, cy=16) -->
    <!-- Muscular Arm extending from shoulder (x=88, y=56) up to gauntlet (x=65, y=22) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#pantherSuit)" stroke="#050608" stroke-width="1.3"/>
    <!-- Glowing Purple Nano-Circuit on Forearm -->
    <path d="M 80 48 L 72 34 L 66 28" fill="none" stroke="#9d4edd" stroke-width="1" filter="url(#kineticGlow)"/>
    <!-- Gauntlet Wristband -->
    <rect x="58" y="20" width="14" height="4.5" rx="1.5" transform="rotate(-25 65 22)" fill="#14161a" stroke="#9d4edd" stroke-width="0.8"/>

    <!-- Clenched Gauntlet at cx=65, cy=22 -->
    <ellipse cx="65" cy="22" rx="9" ry="6.5" fill="url(#pantherSuit)" stroke="#000" stroke-width="1.2"/>
    <!-- Curled fingers gripping tether -->
    <rect x="58" y="16" width="14" height="4" rx="2" fill="#1c1f24" stroke="#050608" stroke-width="0.7"/>

    <!-- Sharp Silver Vibranium Claws clutching kinetic weave at cx=65, cy=16 -->
    <polygon points="56,15 54,9 58,13" fill="url(#silverClaw)"/>
    <polygon points="61,14 61,8 64,12" fill="url(#silverClaw)"/>
    <polygon points="67,13 70,8 69,14" fill="url(#silverClaw)"/>
    <polygon points="72,14 77,9 75,15" fill="url(#silverClaw)"/>

    <!-- Kinetic Pulse Node (Direct Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="6.5" fill="url(#kineticEnergy)" filter="url(#kineticGlow)"/>
    <circle cx="65" cy="16" r="2.4" fill="#ffffff"/>

    <!-- 2. LEFT ARM / SHOULDER SILHOUETTE -->
    <path d="M 28 80 C 22 84 18 96 16 112 C 22 108 26 98 28 88 Z" fill="url(#pantherSuit)" stroke="#050608" stroke-width="1"/>

    <!-- 3. BLACK PANTHER MASK (Looking up toward claws) -->
    <path d="M 32 50 C 32 30 46 24 58 24 C 70 24 84 30 84 50 C 85 70 84 88 78 98 C 73 106 65 110 58 110 C 51 110 43 106 38 98 C 33 88 31 70 32 50 Z" fill="url(#pantherSuit)" stroke="#050608" stroke-width="2"/>

    <!-- Feline Ears -->
    <polygon points="34,42 36,28 44,36" fill="url(#pantherSuit)" stroke="#050608" stroke-width="1"/>
    <polygon points="82,42 80,28 72,36" fill="url(#pantherSuit)" stroke="#050608" stroke-width="1"/>
    <polygon points="36,36 38,30 42,35" fill="url(#silverClaw)"/>
    <polygon points="80,36 78,30 74,35" fill="url(#silverClaw)"/>

    <!-- Brow Silver Accents -->
    <path d="M 42 46 Q 50 42 58 46" fill="none" stroke="url(#silverClaw)" stroke-width="1.3"/>
    <path d="M 74 46 Q 66 42 58 46" fill="none" stroke="url(#silverClaw)" stroke-width="1.3"/>

    <!-- Fierce White Vibranium Eyes (Looking up) -->
    <polygon points="42,58 54,62 48,66 40,63" fill="#ffffff" filter="url(#kineticGlow)"/>
    <polygon points="74,58 62,62 68,66 76,63" fill="#ffffff" filter="url(#kineticGlow)"/>
    <polygon points="44,59 52,62 48,65 42,63" fill="#df8aff"/>
    <polygon points="72,59 64,62 68,65 74,63" fill="#df8aff"/>

    <!-- Muzzle / Jaw Silver Accents -->
    <path d="M 52 82 L 58 87 L 64 82" fill="none" stroke="url(#silverClaw)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="58" y1="87" x2="58" y2="96" stroke="url(#silverClaw)" stroke-width="1.2"/>

    <!-- 4. VIBRANIUM CLAW NECKLACE & CHEST -->
    <path d="M 28 110 C 16 116 10 132 8 150 C 28 154 88 154 108 150 C 106 132 100 116 88 110 C 78 120 68 124 58 124 C 48 124 38 120 28 110 Z" fill="url(#pantherSuit)" stroke="#050608" stroke-width="2"/>

    <!-- Iconic Silver Tooth Necklace -->
    <polygon points="40,118 42,128 44,118" fill="url(#silverClaw)"/>
    <polygon points="46,120 48,132 51,120" fill="url(#silverClaw)"/>
    <polygon points="53,122 55,136 58,122" fill="url(#silverClaw)"/>
    <polygon points="58,122 61,136 63,122" fill="url(#silverClaw)"/>
    <polygon points="65,120 68,132 70,120" fill="url(#silverClaw)"/>
    <polygon points="72,118 74,128 76,118" fill="url(#silverClaw)"/>

    <!-- Kinetic Purple Nano-Veins on Chest -->
    <path d="M 36 138 L 48 132 L 58 138 L 68 132 L 80 138" fill="none" stroke="#9d4edd" stroke-width="1.2" opacity="0.8" filter="url(#kineticGlow)"/>
  </g>
</svg>
