<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Mjolnir & Armor Steel -->
    <linearGradient id="thorSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d4dce8"/>
      <stop offset="70%" stop-color="#7a8799"/>
      <stop offset="100%" stop-color="#36404d"/>
    </linearGradient>

    <!-- Golden Wing / Accents -->
    <linearGradient id="thorGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="40%" stop-color="#ffd23f"/>
      <stop offset="80%" stop-color="#ba8811"/>
      <stop offset="100%" stop-color="#593e00"/>
    </linearGradient>

    <!-- Thor Skin Tone -->
    <radialGradient id="thorSkin" cx="48%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffe3cb"/>
      <stop offset="45%" stop-color="#f5be93"/>
      <stop offset="80%" stop-color="#cb8a5e"/>
      <stop offset="100%" stop-color="#804e2d"/>
    </radialGradient>

    <!-- Blonde Hair -->
    <linearGradient id="thorBlonde" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="40%" stop-color="#e3b63b"/>
      <stop offset="80%" stop-color="#946e10"/>
      <stop offset="100%" stop-color="#4d3700"/>
    </linearGradient>

    <!-- Electric Lightning Glow -->
    <filter id="thorLightningGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="thor3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#thor3DShadow)">
    <!-- 1. RAISED ARM & GAUNTLET HOLDING MJOLNIR AT (cx=65, cy=16) -->
    <!-- Muscular Arm extending from shoulder (x=90, y=56) up to gauntlet (x=65, y=24) -->
    <path d="M 88 56 L 76 32 L 66 24 L 58 28 L 68 46 L 80 62 Z" fill="url(#thorSkin)" stroke="#663e23" stroke-width="1.3"/>
    <!-- Leather & Steel Vambrace on Forearm -->
    <rect x="62" y="24" width="14" height="12" rx="2" transform="rotate(-30 69 30)" fill="#4d3019" stroke="#222" stroke-width="0.9"/>
    <rect x="64" y="27" width="10" height="6" rx="1" transform="rotate(-30 69 30)" fill="url(#thorSteel)"/>

    <!-- Clenched Gauntlet Fist Clutching Mjolnir's Handle (at cx=65, cy=24) -->
    <ellipse cx="65" cy="24" rx="8.5" ry="6.5" fill="url(#thorSteel)" stroke="#1a2028" stroke-width="1.1"/>
    <rect x="58" y="21" width="14" height="3.5" rx="1.7" fill="#8896a6" stroke="#222" stroke-width="0.7"/>

    <!-- Mjolnir Hammer Head (Direct connection at cx=65, cy=16 where lightning strikes!) -->
    <rect x="48" y="10" width="34" height="12" rx="3" fill="url(#thorSteel)" stroke="#1a2028" stroke-width="1.4"/>
    <rect x="52" y="12" width="26" height="8" rx="1.5" fill="#4a5563" stroke="url(#thorSteel)" stroke-width="0.7"/>
    <!-- Glowing Runes on Hammer Head -->
    <g filter="url(#thorLightningGlow)">
      <line x1="56" y1="16" x2="74" y2="16" stroke="#8ae6ff" stroke-width="1.5"/>
      <circle cx="65" cy="16" r="2.5" fill="#ffffff"/>
    </g>

    <!-- 2. THOR'S HEAD & ASGARDIAN WINGED HELMET (Looking up proud at Mjolnir) -->
    <!-- Helmet Base -->
    <path d="M 34 52 C 34 36 46 30 58 30 C 70 30 82 36 82 52 C 83 66 82 80 78 90 C 74 98 66 102 58 102 C 50 102 42 98 38 90 C 34 80 33 66 34 52 Z" fill="url(#thorSteel)" stroke="#222b36" stroke-width="1.8"/>

    <!-- Golden Wings -->
    <path d="M 36 52 C 22 42 14 24 18 10 C 22 20 30 34 38 46 Z" fill="url(#thorGold)" stroke="#664600" stroke-width="1"/>
    <path d="M 80 52 C 94 42 102 24 98 10 C 94 20 86 34 78 46 Z" fill="url(#thorGold)" stroke="#664600" stroke-width="1"/>

    <!-- Flowing Golden Hair -->
    <path d="M 32 56 C 26 70 24 90 26 112 C 30 106 34 96 36 88 Z" fill="url(#thorBlonde)"/>
    <path d="M 84 56 C 90 70 92 90 90 112 C 86 106 82 96 80 88 Z" fill="url(#thorBlonde)"/>

    <!-- Face Cutout -->
    <path d="M 42 56 C 42 50 48 50 58 50 C 68 50 74 50 74 56 C 75 68 74 80 70 88 C 66 96 60 98 58 98 C 56 98 50 96 46 88 C 42 80 41 68 42 56 Z" fill="url(#thorSkin)" stroke="#663e23" stroke-width="1.2"/>

    <!-- Electric Lightning Eyes -->
    <g filter="url(#thorLightningGlow)">
      <ellipse cx="50" cy="66" rx="4" ry="3" fill="#70ddff"/>
      <circle cx="50" cy="66" r="1.3" fill="#ffffff"/>
      <ellipse cx="66" cy="66" rx="4" ry="3" fill="#70ddff"/>
      <circle cx="66" cy="66" r="1.3" fill="#ffffff"/>
    </g>

    <!-- Nose & Determined Mouth -->
    <path d="M 58 60 L 56 74 L 60 74" stroke="#8c532d" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <line x1="52" y1="84" x2="64" y2="84" stroke="#5a3118" stroke-width="2" stroke-linecap="round"/>

    <!-- 3. CRIMSON CAPE & ASGARDIAN ARMOR -->
    <!-- Red Cape -->
    <path d="M 22 108 C 14 118 10 138 8 154 C 30 156 86 156 112 154 C 110 138 106 118 98 108 Z" fill="#991424" stroke="#52050f" stroke-width="1.6"/>
    <!-- Dark Armor Vest with Discs -->
    <path d="M 28 106 C 20 114 16 130 14 150 C 34 154 84 154 104 150 C 102 130 98 114 90 106 C 80 116 70 120 58 120 C 46 120 36 116 28 106 Z" fill="#1e232b" stroke="#0a0c0f" stroke-width="1.8"/>

    <!-- Silver Armor Discs -->
    <circle cx="42" cy="120" r="5.5" fill="url(#thorSteel)" stroke="#222" stroke-width="1"/>
    <circle cx="74" cy="120" r="5.5" fill="url(#thorSteel)" stroke="#222" stroke-width="1"/>
    <circle cx="46" cy="138" r="5" fill="url(#thorSteel)" stroke="#222" stroke-width="1"/>
    <circle cx="70" cy="138" r="5" fill="url(#thorSteel)" stroke="#222" stroke-width="1"/>
  </g>
</svg>
