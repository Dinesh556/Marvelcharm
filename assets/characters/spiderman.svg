<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- 3D Suit Red Gradient -->
    <radialGradient id="spideySuitRed" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ff3b4b"/>
      <stop offset="50%" stop-color="#d61426"/>
      <stop offset="85%" stop-color="#8a0512"/>
      <stop offset="100%" stop-color="#4a0008"/>
    </radialGradient>

    <!-- Deep Blue Suit Tech Fabric -->
    <linearGradient id="spideyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e54bc"/>
      <stop offset="55%" stop-color="#0e327a"/>
      <stop offset="100%" stop-color="#051538"/>
    </linearGradient>

    <!-- Expressive Lens Glass Gradient -->
    <linearGradient id="spideyLens" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eaf4fc"/>
      <stop offset="100%" stop-color="#a8d0f4"/>
    </linearGradient>

    <!-- Webbing Shadow Filter -->
    <filter id="spidey3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#spidey3DShadow)">
    <!-- 1. RAISED GLOVED HAND CLUTCHING WEB AT (cx=65, cy=16) -->
    <!-- Gloved Hand Back & Palm -->
    <ellipse cx="65" cy="18" rx="11" ry="8" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1.2"/>
    <!-- Wrist & Web-Shooter Gauntlet -->
    <path d="M 58 22 L 55 34 L 75 34 L 72 22 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1.2"/>
    <!-- Metallic Web-Shooter Trigger Nozzle -->
    <rect x="62" y="25" width="6" height="3" rx="1" fill="#d0d8e2" stroke="#222" stroke-width="0.8"/>
    <circle cx="65" cy="26.5" r="1" fill="#ff2233"/>

    <!-- Curled Gloved Fingers Tightly Gripping the Web Line (cx=65, cy=16) -->
    <!-- Finger Knuckles & Segments wrapping across the web -->
    <rect x="56" y="11" width="18" height="4.2" rx="2.1" fill="#ff3b4b" stroke="#5a000a" stroke-width="0.9"/>
    <rect x="57" y="15" width="16" height="4" rx="2" fill="#d61426" stroke="#5a000a" stroke-width="0.9"/>
    <rect x="58" y="19" width="14" height="3.8" rx="1.9" fill="#b00f1e" stroke="#4a0008" stroke-width="0.9"/>
    <!-- Thumb wrapping across front of web -->
    <path d="M 53 14 C 53 10 59 10 61 14 C 62 17 58 19 54 18 Z" fill="#ff4a58" stroke="#5a000a" stroke-width="0.8"/>

    <!-- Web Seams on Gloved Hand -->
    <path d="M 60 11 Q 65 14 70 11" stroke="#222" stroke-width="0.7" fill="none" opacity="0.85"/>
    <path d="M 60 16 Q 65 19 70 16" stroke="#222" stroke-width="0.7" fill="none" opacity="0.85"/>
    <line x1="65" y1="11" x2="65" y2="23" stroke="#222" stroke-width="0.7" opacity="0.85"/>

    <!-- 2. MUSCULAR ARMS EXTENDING DOWN TO INVERTED SHOULDERS -->
    <!-- Right Arm (leading down to inverted right shoulder) -->
    <path d="M 72 26 L 86 48 L 76 52 L 67 32 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1.2"/>
    <path d="M 74 38 L 84 48 L 78 52 L 70 42 Z" fill="url(#spideyBlue)" opacity="0.9"/>

    <!-- Left Arm (bent up assisting the grip on the web) -->
    <path d="M 58 26 L 44 48 L 54 52 L 63 32 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1.2"/>
    <path d="M 56 38 L 46 48 L 52 52 L 60 42 Z" fill="url(#spideyBlue)" opacity="0.9"/>

    <!-- 3. INVERTED ACROBATIC LEGS (Curled wide at sides) -->
    <!-- Left Inverted Leg & Boot -->
    <path d="M 44 50 C 26 40 12 46 12 60 C 12 72 22 78 34 72 L 44 64 Z" fill="url(#spideyBlue)" stroke="#061638" stroke-width="1.5"/>
    <!-- Left Red Boot & Webbing -->
    <path d="M 13 60 C 12 50 20 44 26 44 L 28 52 C 22 52 17 56 15 60 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1"/>
    <!-- Right Inverted Leg & Boot -->
    <path d="M 86 50 C 104 40 118 46 118 60 C 118 72 108 78 96 72 L 86 64 Z" fill="url(#spideyBlue)" stroke="#061638" stroke-width="1.5"/>
    <!-- Right Red Boot & Webbing -->
    <path d="M 117 60 C 118 50 110 44 104 44 L 102 52 C 108 52 113 56 115 60 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1"/>

    <!-- 4. INVERTED TORSO (Hanging below shoulders) -->
    <path d="M 44 50 L 86 50 L 80 84 L 50 84 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1.4"/>
    <!-- Blue Torso Sides -->
    <path d="M 44 50 L 52 50 L 50 84 L 46 84 Z" fill="url(#spideyBlue)"/>
    <path d="M 86 50 L 78 50 L 80 84 L 84 84 Z" fill="url(#spideyBlue)"/>

    <!-- Inverted Black Spider Emblem on Chest -->
    <ellipse cx="65" cy="65" rx="3.5" ry="5.5" fill="#111111"/>
    <!-- Inverted Spider Legs radiating -->
    <g stroke="#111111" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M 63 63 Q 54 56 50 52"/>
      <path d="M 67 63 Q 76 56 80 52"/>
      <path d="M 63 65 Q 52 62 48 64"/>
      <path d="M 67 65 Q 78 62 82 64"/>
      <path d="M 63 67 Q 54 74 50 78"/>
      <path d="M 67 67 Q 76 74 80 78"/>
      <path d="M 64 69 Q 58 77 54 82"/>
      <path d="M 66 69 Q 72 77 76 82"/>
    </g>

    <!-- Torso Web Seams -->
    <line x1="65" y1="50" x2="65" y2="84" stroke="#111" stroke-width="0.8" opacity="0.75"/>
    <path d="M 52 58 Q 65 62 78 58" stroke="#111" stroke-width="0.8" fill="none" opacity="0.75"/>
    <path d="M 51 74 Q 65 78 79 74" stroke="#111" stroke-width="0.8" fill="none" opacity="0.75"/>

    <!-- Inverted Neck -->
    <polygon points="56,82 74,82 71,94 59,94" fill="url(#spideySuitRed)"/>

    <!-- 5. INVERTED SPIDER-MAN MASK (At bottom, looking directly forward) -->
    <!-- Mask Outline (Chin at top, crown at bottom) -->
    <path d="M 44 96 C 44 87 53 85 65 85 C 77 85 86 87 86 96 C 88 110 89 130 83 142 C 77 153 69 157 65 157 C 61 157 53 153 47 142 C 41 130 42 110 44 96 Z" fill="url(#spideySuitRed)" stroke="#4a0008" stroke-width="1.8"/>

    <!-- Mask Webbing (Radiating inverted from nose bridge at cy=118) -->
    <g stroke="#1a0003" stroke-width="0.85" fill="none" opacity="0.8">
      <line x1="65" y1="118" x2="65" y2="86"/>
      <line x1="65" y1="118" x2="65" y2="155"/>
      <line x1="65" y1="118" x2="45" y2="100"/>
      <line x1="65" y1="118" x2="85" y2="100"/>
      <line x1="65" y1="118" x2="43" y2="126"/>
      <line x1="65" y1="118" x2="87" y2="126"/>
      <line x1="65" y1="118" x2="49" y2="147"/>
      <line x1="65" y1="118" x2="81" y2="147"/>
      <!-- Concentric Web Rings -->
      <path d="M 58 110 Q 65 106 72 110"/>
      <path d="M 54 118 Q 65 114 76 118"/>
      <path d="M 52 128 Q 65 124 78 128"/>
      <path d="M 51 140 Q 65 135 79 140"/>
    </g>

    <!-- Inverted Expressive Spider Lenses -->
    <!-- Left Lens (Inverted) -->
    <path d="M 45 114 C 46 102 58 104 62 112 C 64 124 58 134 47 130 C 43 126 44 120 45 114 Z" fill="#08080c" stroke="#000000" stroke-width="1.3"/>
    <path d="M 47 114 C 48 105 57 106 60 112 C 62 122 56 130 49 128 C 45 124 46 119 47 114 Z" fill="url(#spideyLens)"/>
    <!-- Right Lens (Inverted) -->
    <path d="M 85 114 C 84 102 72 104 68 112 C 66 124 72 134 83 130 C 87 126 86 120 85 114 Z" fill="#08080c" stroke="#000000" stroke-width="1.3"/>
    <path d="M 83 114 C 82 105 73 106 70 112 C 68 122 74 130 81 128 C 85 124 84 119 83 114 Z" fill="url(#spideyLens)"/>

    <!-- Lens Glare Specular Highlights -->
    <ellipse cx="51" cy="114" rx="3.5" ry="5.5" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="79" cy="114" rx="3.5" ry="5.5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
