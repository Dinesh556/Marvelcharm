<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Cap Blue Suit -->
    <radialGradient id="capBlue" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2460cc"/>
      <stop offset="45%" stop-color="#143c8a"/>
      <stop offset="85%" stop-color="#081f4d"/>
      <stop offset="100%" stop-color="#030c1f"/>
    </radialGradient>

    <!-- Brown Tactical Leather -->
    <linearGradient id="capLeather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e4629"/>
      <stop offset="60%" stop-color="#452a16"/>
      <stop offset="100%" stop-color="#211208"/>
    </linearGradient>

    <!-- Vibranium Silver -->
    <linearGradient id="capSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4dce8"/>
      <stop offset="80%" stop-color="#8a99ad"/>
      <stop offset="100%" stop-color="#4a5563"/>
    </linearGradient>

    <radialGradient id="capSkin" cx="48%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffe3cb"/>
      <stop offset="45%" stop-color="#f2be94"/>
      <stop offset="80%" stop-color="#c48a5e"/>
      <stop offset="100%" stop-color="#7a4b2a"/>
    </radialGradient>

    <filter id="cap3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#cap3DShadow)">
    <!-- 1. RAISED ARM & TACTICAL GLOVED HAND AT (cx=65, cy=16) -->
    <!-- Muscular Sleeve extending from shoulder (x=90, y=56) up to glove (x=65, y=22) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#capBlue)" stroke="#081f4d" stroke-width="1.3"/>
    <rect x="58" y="20" width="14" height="5" rx="1.5" transform="rotate(-25 65 22)" fill="url(#capLeather)" stroke="#211208" stroke-width="0.8"/>

    <!-- Brown Leather Gloved Hand firmly clutching carabiner (at cx=65, cy=22) -->
    <ellipse cx="65" cy="22" rx="9" ry="6.5" fill="url(#capLeather)" stroke="#211208" stroke-width="1.1"/>
    <!-- Curled fingers gripping clamp -->
    <rect x="58" y="16" width="14" height="4" rx="2" fill="#59371e" stroke="#211208" stroke-width="0.7"/>

    <!-- Metallic Tactical Carabiner Clamp (Direct Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="6.5" fill="none" stroke="url(#capSilver)" stroke-width="2.2"/>
    <rect x="63" y="10" width="4" height="4" fill="#333333"/>
    <circle cx="65" cy="16" r="2.2" fill="#ffffff"/>

    <!-- 2. LEFT ARM WITH VIBRANIUM SHIELD -->
    <circle cx="28" cy="80" r="16" fill="#b81622" stroke="#4a0008" stroke-width="1"/>
    <circle cx="28" cy="80" r="12" fill="#ffffff"/>
    <circle cx="28" cy="80" r="8" fill="#b81622"/>
    <circle cx="28" cy="80" r="5" fill="#0f2b66"/>
    <polygon points="28,76 29,79 32,79 29.5,81 30.5,84 28,82.5 25.5,84 26.5,81 24,79 27,79" fill="#ffffff"/>

    <!-- 3. HELMET & COWL (Looking up toward cable grip) -->
    <path d="M 34 50 C 34 34 46 28 58 28 C 70 28 80 34 80 50 C 81 64 80 78 76 86 C 72 94 65 98 58 98 C 51 98 44 94 40 86 C 36 78 35 64 34 50 Z" fill="url(#capBlue)" stroke="#081f4d" stroke-width="1.8"/>

    <!-- Silver Wings on Cowl -->
    <path d="M 36 50 C 28 46 26 38 30 32 C 32 36 34 42 36 48 Z" fill="url(#capSilver)"/>
    <path d="M 78 50 C 86 46 88 38 84 32 C 82 36 80 42 78 48 Z" fill="url(#capSilver)"/>

    <!-- Embossed Silver 'A' on Brow -->
    <text x="58" y="48" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="url(#capSilver)" text-anchor="middle" stroke="#081f4d" stroke-width="0.7">A</text>

    <!-- Face Cutout -->
    <path d="M 40 56 C 40 50 48 50 58 50 C 68 50 74 50 74 56 C 75 66 74 76 70 84 C 66 92 60 94 58 94 C 56 94 50 92 46 84 C 42 76 41 66 40 56 Z" fill="url(#capSkin)" stroke="#613b20" stroke-width="1.2"/>
    <!-- Leather Chin Strap -->
    <path d="M 42 74 C 44 86 50 94 58 95 C 66 94 72 86 74 74 L 70 74 C 68 83 64 90 58 91 C 52 90 48 83 46 74 Z" fill="url(#capLeather)"/>

    <!-- Heroic Blue Eyes (Looking up) -->
    <ellipse cx="48" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="48" cy="62" r="1.6" fill="#2460cc"/>
    <circle cx="48" cy="62" r="0.7" fill="#030c1f"/>
    <ellipse cx="66" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="66" cy="62" r="1.6" fill="#2460cc"/>
    <circle cx="66" cy="62" r="0.7" fill="#030c1f"/>

    <path d="M 58 58 L 56 70 L 60 70" stroke="#7a4625" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <line x1="52" y1="80" x2="64" y2="80" stroke="#542e17" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 4. CHEST WITH STAR & STRIPES -->
    <path d="M 28 106 C 18 112 14 128 12 146 C 32 150 82 150 102 146 C 100 128 96 112 88 106 C 78 116 68 120 58 120 C 48 120 38 116 28 106 Z" fill="url(#capBlue)" stroke="#081f4d" stroke-width="1.8"/>

    <!-- Silver Star on Chest -->
    <circle cx="58" cy="122" r="11" fill="#0f2b66" stroke="#2460cc" stroke-width="1"/>
    <polygon points="58,114 60.5,119.5 66.5,120 62,123.5 63.5,129.5 58,126 52.5,129.5 54,123.5 49.5,120 55.5,119.5" fill="url(#capSilver)"/>

    <!-- Abdominal Red/White Stripes -->
    <path d="M 30 140 L 42 140 L 42 148 L 28 148 Z" fill="#b81622"/>
    <path d="M 42 140 L 52 140 L 52 148 L 42 148 Z" fill="#ffffff"/>
    <path d="M 64 140 L 74 140 L 74 148 L 64 148 Z" fill="#ffffff"/>
    <path d="M 74 140 L 86 140 L 88 148 L 74 148 Z" fill="#b81622"/>
  </g>
</svg>
