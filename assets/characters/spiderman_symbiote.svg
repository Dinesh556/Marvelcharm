<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Liquid Alien Symbiote Black -->
    <radialGradient id="symbioteSuitBlack" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3a404e"/>
      <stop offset="50%" stop-color="#181c22"/>
      <stop offset="85%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Liquid Alien Specular Sheen -->
    <linearGradient id="symbioteSheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#7e96b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing White Eyes & Insignia -->
    <linearGradient id="symbioteWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#eaf1f8"/>
      <stop offset="100%" stop-color="#b0c8e2"/>
    </linearGradient>

    <filter id="symbiote3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#symbiote3DShadow)">
    <!-- 1. RAISED ALIEN CLAWED HAND CLUTCHING WEB AT (cx=65, cy=16) -->
    <!-- Black Alien Hand Back & Palm -->
    <ellipse cx="65" cy="18" rx="11" ry="8" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.2"/>
    <path d="M 58 22 L 55 34 L 75 34 L 72 22 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.2"/>
    <polygon points="63,24 67,24 66,28 64,28" fill="#ffffff"/>

    <!-- Curled Alien Claw Fingers Tightly Gripping the Web Line (cx=65, cy=16) -->
    <rect x="56" y="11" width="18" height="4.2" rx="2.1" fill="#2c323d" stroke="#000" stroke-width="0.9"/>
    <rect x="57" y="15" width="16" height="4" rx="2" fill="#20242c" stroke="#000" stroke-width="0.9"/>
    <rect x="58" y="19" width="14" height="3.8" rx="1.9" fill="#14171d" stroke="#000" stroke-width="0.9"/>
    <!-- Clawed thumb wrapping across front of web -->
    <path d="M 53 14 C 53 10 59 10 61 14 C 62 17 58 19 54 18 Z" fill="#3a404e" stroke="#000" stroke-width="0.8"/>

    <!-- 2. MUSCULAR ALIEN ARMS EXTENDING DOWN TO INVERTED SHOULDERS -->
    <!-- Right Arm -->
    <path d="M 72 26 L 86 48 L 76 52 L 67 32 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.2"/>
    <path d="M 72 26 L 86 48 L 76 52 L 67 32 Z" fill="url(#symbioteSheen)"/>
    <!-- Left Arm -->
    <path d="M 58 26 L 44 48 L 54 52 L 63 32 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.2"/>
    <path d="M 58 26 L 44 48 L 54 52 L 63 32 Z" fill="url(#symbioteSheen)"/>

    <!-- 3. INVERTED ACROBATIC LEGS (Liquid Alien Black) -->
    <path d="M 44 50 C 26 40 12 46 12 60 C 12 72 22 78 34 72 L 44 64 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.6"/>
    <path d="M 44 50 C 26 40 12 46 12 60 C 12 72 22 78 34 72 L 44 64 Z" fill="url(#symbioteSheen)"/>
    <path d="M 86 50 C 104 40 118 46 118 60 C 118 72 108 78 96 72 L 86 64 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.6"/>
    <path d="M 86 50 C 104 40 118 46 118 60 C 118 72 108 78 96 72 L 86 64 Z" fill="url(#symbioteSheen)"/>

    <!-- 4. INVERTED TORSO (Liquid Alien Black with Massive White Spider) -->
    <path d="M 44 50 L 86 50 L 80 84 L 50 84 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.5"/>
    <path d="M 44 50 L 86 50 L 80 84 L 50 84 Z" fill="url(#symbioteSheen)"/>

    <!-- Massive Organic White Symbiote Spider (Inverted) -->
    <ellipse cx="65" cy="65" rx="4.5" ry="6.5" fill="url(#symbioteWhite)"/>
    <g stroke="url(#symbioteWhite)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <!-- Upper Inverted Legs -->
      <path d="M 63 62 Q 48 54 42 48"/>
      <path d="M 67 62 Q 82 54 88 48"/>
      <path d="M 63 65 Q 46 60 38 62"/>
      <path d="M 67 65 Q 84 60 92 62"/>
      <!-- Lower Inverted Legs -->
      <path d="M 63 68 Q 48 75 44 80"/>
      <path d="M 67 68 Q 82 75 86 80"/>
      <path d="M 64 70 Q 54 80 50 84"/>
      <path d="M 66 70 Q 76 80 80 84"/>
    </g>

    <!-- Inverted Neck -->
    <polygon points="56,82 74,82 71,94 59,94" fill="url(#symbioteSuitBlack)"/>

    <!-- 5. INVERTED SYMBIOTE MASK (At the bottom, looking forward) -->
    <path d="M 44 96 C 44 87 53 85 65 85 C 77 85 86 87 86 96 C 88 110 89 130 83 142 C 77 153 69 157 65 157 C 61 157 53 153 47 142 C 41 130 42 110 44 96 Z" fill="url(#symbioteSuitBlack)" stroke="#000000" stroke-width="1.8"/>
    <path d="M 44 96 C 44 87 53 85 65 85 C 77 85 86 87 86 96 C 88 110 89 130 83 142 C 77 153 69 157 65 157 C 61 157 53 153 47 142 C 41 130 42 110 44 96 Z" fill="url(#symbioteSheen)"/>

    <!-- Inverted Large Jagged Symbiote Eyes -->
    <!-- Left Eye -->
    <path d="M 43 114 C 45 100 60 102 63 112 C 65 126 57 136 45 130 C 41 124 42 118 43 114 Z" fill="url(#symbioteWhite)" stroke="#000000" stroke-width="0.8"/>
    <polygon points="46,114 50,118 48,120" fill="#000000"/>
    <!-- Right Eye -->
    <path d="M 87 114 C 85 100 70 102 67 112 C 65 126 73 136 85 130 C 89 124 88 118 87 114 Z" fill="url(#symbioteWhite)" stroke="#000000" stroke-width="0.8"/>
    <polygon points="84,114 80,118 82,120" fill="#000000"/>

    <!-- Specular Sheen in Eyes -->
    <ellipse cx="49" cy="113" rx="3.5" ry="5.5" fill="#ffffff"/>
    <ellipse cx="81" cy="113" rx="3.5" ry="5.5" fill="#ffffff"/>
  </g>
</svg>
