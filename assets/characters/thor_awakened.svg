<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Awakened Dark Armor -->
    <radialGradient id="asgardianDarkArmor" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d4654"/>
      <stop offset="50%" stop-color="#1e232b"/>
      <stop offset="90%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Surging Lightning Runes / Discs -->
    <radialGradient id="electricRuneDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#70ddff"/>
      <stop offset="80%" stop-color="#1c75b8"/>
      <stop offset="100%" stop-color="#0a2c47"/>
    </radialGradient>

    <radialGradient id="thorSkinAwakened" cx="46%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffe3cb"/>
      <stop offset="45%" stop-color="#f2c199"/>
      <stop offset="80%" stop-color="#cb8f65"/>
      <stop offset="100%" stop-color="#8a5331"/>
    </radialGradient>

    <linearGradient id="thorHairShort" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe88f"/>
      <stop offset="35%" stop-color="#deb047"/>
      <stop offset="75%" stop-color="#8c6517"/>
      <stop offset="100%" stop-color="#473105"/>
    </linearGradient>

    <radialGradient id="awakenedEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#6bebff"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </radialGradient>

    <filter id="lightningGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="thor3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#thor3DShadow)">
    <!-- 1. RAISED ARM & ELECTRIFIED FIST AT (cx=65, cy=16) -->
    <!-- Muscular Arm extending from shoulder (x=90, y=56) up to fist (x=65, y=16) -->
    <path d="M 88 56 L 76 32 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#thorSkinAwakened)" stroke="#6b3f23" stroke-width="1.3"/>
    <!-- Black Asgardian Leather Bracer on Forearm -->
    <rect x="62" y="24" width="14" height="12" rx="2" transform="rotate(-30 69 30)" fill="#1e232b" stroke="#0e1014" stroke-width="0.9"/>

    <!-- Clenched Fist Channeling Lightning Directly at (cx=65, cy=16) -->
    <ellipse cx="65" cy="18" rx="9" ry="7" fill="url(#thorSkinAwakened)" stroke="#6b3f23" stroke-width="1.1"/>
    <!-- Curled fingers around lightning arc -->
    <rect x="58" y="14" width="14" height="4" rx="2" fill="#cb8f65" stroke="#6b3f23" stroke-width="0.7"/>
    <!-- Electric Pulse Core at Fist Grip -->
    <circle cx="65" cy="16" r="6" fill="url(#awakenedEyeGlow)" filter="url(#lightningGlow)"/>
    <circle cx="65" cy="16" r="2.6" fill="#ffffff"/>

    <!-- Lightning arcs branching out from fist -->
    <path d="M 61 8 L 65 16 L 69 8" stroke="#ffffff" stroke-width="1.8" fill="none" filter="url(#lightningGlow)"/>
    <path d="M 57 16 L 51 12 L 47 16" stroke="#70ddff" stroke-width="1" fill="none" filter="url(#lightningGlow)"/>
    <path d="M 73 16 L 79 12 L 83 16" stroke="#70ddff" stroke-width="1" fill="none" filter="url(#lightningGlow)"/>

    <!-- 2. SHORT HAIR & SAKAAR WAR PAINT HEAD (Looking up at lightning fist) -->
    <path d="M 33 46 C 32 34 46 24 60 24 C 74 24 88 34 87 46 C 88 60 85 76 83 84 C 79 78 78 60 76 52 C 68 42 50 42 42 52 C 40 60 39 78 37 84 C 35 76 32 60 33 46 Z" fill="url(#thorHairShort)"/>

    <!-- Thor Face -->
    <path d="M 40 48 C 40 34 50 30 60 30 C 70 30 80 34 80 48 C 81 64 80 80 76 90 C 70 98 62 100 58 100 C 54 100 46 98 42 90 C 38 80 39 64 40 48 Z" fill="url(#thorSkinAwakened)" stroke="#6b3f23" stroke-width="1.2"/>

    <!-- Red Sakaar War Paint -->
    <path d="M 44 40 L 52 46 L 49 70 L 45 72 L 43 44 Z" fill="#b81622" opacity="0.85"/>

    <!-- Awakened Surging Celestial Electric Eyes -->
    <g filter="url(#lightningGlow)">
      <ellipse cx="50" cy="62" rx="5.5" ry="3.8" fill="url(#awakenedEyeGlow)"/>
      <ellipse cx="70" cy="62" rx="5.5" ry="3.8" fill="url(#awakenedEyeGlow)"/>
      <circle cx="50" cy="62" r="2" fill="#ffffff"/>
      <circle cx="70" cy="62" r="2" fill="#ffffff"/>
    </g>

    <!-- Nose & Beard -->
    <path d="M 58 56 L 56 72 L 60 72" stroke="#8c532d" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M 48 76 C 54 79 66 79 72 76 C 76 84 72 96 60 98 C 48 96 44 84 48 76 Z" fill="#996e1b" opacity="0.45"/>
    <line x1="52" y1="84" x2="66" y2="84" stroke="#5a3118" stroke-width="2" stroke-linecap="round"/>

    <!-- 3. TORSO WITH SURGING RUNES & CRIMSON CLOAK -->
    <path d="M 22 106 C 14 116 10 134 8 148 C 30 152 86 152 110 148 C 108 134 104 116 96 106 Z" fill="#660a12" stroke="#380408" stroke-width="1.6"/>
    <path d="M 28 104 C 18 112 14 128 12 146 C 34 150 84 150 104 146 C 102 128 98 112 90 104 C 80 114 70 118 58 118 C 46 118 36 114 28 104 Z" fill="url(#asgardianDarkArmor)" stroke="#090b0e" stroke-width="1.8"/>

    <!-- Electric Discs & Lightning Arcs -->
    <circle cx="42" cy="118" r="5.5" fill="url(#electricRuneDisc)" stroke="#70ddff" stroke-width="1.2"/>
    <circle cx="74" cy="118" r="5.5" fill="url(#electricRuneDisc)" stroke="#70ddff" stroke-width="1.2"/>
    <circle cx="46" cy="134" r="5" fill="url(#electricRuneDisc)" stroke="#70ddff" stroke-width="1.2"/>
    <circle cx="70" cy="134" r="5" fill="url(#electricRuneDisc)" stroke="#70ddff" stroke-width="1.2"/>

    <g stroke="#ffffff" stroke-width="1.2" fill="none" filter="url(#lightningGlow)">
      <path d="M 42 118 L 50 124 L 58 120 L 66 124 L 74 118"/>
    </g>
  </g>
</svg>
