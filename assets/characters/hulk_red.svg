<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Volcanic Red Hulk Skin -->
    <radialGradient id="redHulkSkin" cx="45%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ff3b4b"/>
      <stop offset="40%" stop-color="#cc1022"/>
      <stop offset="80%" stop-color="#7a0510"/>
      <stop offset="100%" stop-color="#3d0006"/>
    </radialGradient>

    <!-- Heavy Chain Obsidian Iron -->
    <linearGradient id="obsidianChain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="50%" stop-color="#303030"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>

    <!-- Jet Black Spiky Hair -->
    <linearGradient id="redHulkHair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3b3f47"/>
      <stop offset="40%" stop-color="#1a1c21"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>

    <!-- Glowing Volcanic Amber Eyes -->
    <radialGradient id="volcanicEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>

    <filter id="volcanicHeatGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="redHulk3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#redHulk3DShadow)">
    <!-- 1. RAISED VOLCANIC MUSCULAR ARM & FIERY RED FIST AT (cx=65, cy=16) -->
    <!-- Colossal Muscular Arm from shoulder (x=92, y=58) up to fist (x=65, y=24) -->
    <path d="M 92 58 L 78 30 L 66 22 L 56 26 L 68 46 L 82 66 Z" fill="url(#redHulkSkin)" stroke="#3d0006" stroke-width="1.6"/>
    <!-- Glowing Orange Heat Veins -->
    <path d="M 82 50 Q 74 38 68 30" fill="none" stroke="#ff5500" stroke-width="1.8" filter="url(#volcanicHeatGlow)"/>

    <!-- Massive Bulging Clenched Volcanic Fist at cx=65, cy=24 -->
    <ellipse cx="65" cy="24" rx="11" ry="8" fill="url(#redHulkSkin)" stroke="#3d0006" stroke-width="1.5"/>
    <!-- Bulging Knuckles clutching obsidian chain link -->
    <rect x="56" y="18" width="18" height="5.5" rx="2.7" fill="#e01b2f" stroke="#3d0006" stroke-width="1"/>
    <circle cx="58" cy="20" r="2.2" fill="#ff5566"/>
    <circle cx="63" cy="19" r="2.4" fill="#ff5566"/>
    <circle cx="68" cy="19" r="2.4" fill="#ff5566"/>
    <circle cx="73" cy="20" r="2.2" fill="#ff5566"/>

    <!-- Heavy Obsidian Gamma Chain Link Gripped at cx=65, cy=16 -->
    <rect x="61" y="8" width="8" height="15" rx="3.5" fill="none" stroke="url(#obsidianChain)" stroke-width="3"/>
    <circle cx="65" cy="16" r="3.5" fill="#ff4400" filter="url(#volcanicHeatGlow)" opacity="0.85"/>

    <!-- 2. MASSIVE LEFT TRAPEZIUS & SHOULDER -->
    <path d="M 22 76 C 14 82 10 98 8 116 C 18 112 24 100 26 88 Z" fill="url(#redHulkSkin)" stroke="#3d0006" stroke-width="1.5"/>

    <!-- 3. RED HULK HEAD & JET BLACK HAIR (Looking up fiercely) -->
    <!-- Jet Black Spiky Hair -->
    <path d="M 28 44 C 26 26 42 22 58 22 C 74 22 88 26 86 44 C 88 56 86 68 83 74 C 80 64 79 52 75 44 C 67 36 49 36 41 44 C 37 52 36 64 33 74 C 30 68 28 56 28 44 Z" fill="url(#redHulkHair)"/>

    <!-- Massive Volcanic Jaw & Face -->
    <path d="M 32 46 C 32 34 44 30 58 30 C 72 30 82 34 82 46 C 84 62 86 82 80 94 C 74 102 66 106 58 106 C 50 106 42 102 36 94 C 30 82 30 62 32 46 Z" fill="url(#redHulkSkin)" stroke="#3d0006" stroke-width="2"/>

    <!-- Heavy Black Furrowed Brow -->
    <path d="M 38 52 L 50 58 L 58 55 L 66 58 L 78 52" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Glowing Volcanic Amber Eyes (Looking up fiercely) -->
    <ellipse cx="46" cy="62" rx="4.5" ry="3.2" fill="#ffffff"/>
    <circle cx="46" cy="61" r="2.2" fill="url(#volcanicEyeGlow)" filter="url(#volcanicHeatGlow)"/>
    <circle cx="46" cy="61" r="0.8" fill="#380000"/>
    <ellipse cx="68" cy="62" rx="4.5" ry="3.2" fill="#ffffff"/>
    <circle cx="68" cy="61" r="2.2" fill="url(#volcanicEyeGlow)" filter="url(#volcanicHeatGlow)"/>
    <circle cx="68" cy="61" r="0.8" fill="#380000"/>

    <!-- Broad Nose -->
    <path d="M 58 56 L 54 70 L 62 70 Z" fill="#7a0510"/>

    <!-- Snarling Mouth with Bared White Teeth -->
    <path d="M 44 80 Q 58 76 72 80 Q 58 92 44 80 Z" fill="#1f0103" stroke="#3d0006" stroke-width="1.4"/>
    <polygon points="46,80 50,83 54,80 58,83 62,80 66,83 70,80" fill="#ffffff"/>
    <polygon points="48,87 52,84 56,87 60,84 64,87 68,84" fill="#ffffff"/>

    <!-- 4. COLOSSAL VOLCANIC PECTORAL CHEST -->
    <path d="M 22 108 C 10 114 4 132 2 152 C 24 156 94 156 116 152 C 114 132 106 114 94 108 C 82 118 70 122 58 122 C 46 122 34 118 22 108 Z" fill="url(#redHulkSkin)" stroke="#3d0006" stroke-width="2.2"/>
    <!-- Pectoral Split & Abs with smoldering glow -->
    <path d="M 28 122 Q 43 134 58 126 Q 73 134 88 122" fill="none" stroke="#3d0006" stroke-width="2.2"/>
    <line x1="58" y1="126" x2="58" y2="152" stroke="#ff4400" stroke-width="1.6" filter="url(#volcanicHeatGlow)"/>
  </g>
</svg>
