<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Metallic Ruby Tiara & Robes -->
    <linearGradient id="tiaraRuby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="35%" stop-color="#d90429"/>
      <stop offset="75%" stop-color="#7a0015"/>
      <stop offset="100%" stop-color="#38000a"/>
    </linearGradient>

    <!-- Chaos Magic Hex Core -->
    <radialGradient id="hexCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ff4d6d"/>
      <stop offset="70%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#590010"/>
    </radialGradient>

    <!-- Auburn Hair -->
    <linearGradient id="auburnHair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#993d24"/>
      <stop offset="40%" stop-color="#662211"/>
      <stop offset="80%" stop-color="#3d1208"/>
      <stop offset="100%" stop-color="#1f0703"/>
    </linearGradient>

    <!-- Fair Radiant Skin -->
    <radialGradient id="wandaSkin" cx="48%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#fff0eb"/>
      <stop offset="45%" stop-color="#f5caba"/>
      <stop offset="80%" stop-color="#c99583"/>
      <stop offset="100%" stop-color="#7a4e40"/>
    </radialGradient>

    <filter id="chaosGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wanda3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#wanda3DShadow)">
    <!-- 1. RAISED MYSTIC ARM & SPELLCASTING MUDRA HAND AT (cx=65, cy=16) -->
    <!-- Crimson Draped Sleeve extending from shoulder (x=88, y=56) up to wrist (x=65, y=24) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#tiaraRuby)" stroke="#38000a" stroke-width="1.3"/>
    <rect x="58" y="20" width="14" height="4.5" rx="1.5" transform="rotate(-25 65 22)" fill="#ffd700" stroke="#8a6d00" stroke-width="0.8"/>

    <!-- Slender Mudra Hand at cx=65, cy=22 -->
    <ellipse cx="65" cy="22" rx="8" ry="6" fill="url(#wandaSkin)" stroke="#7a4e40" stroke-width="1"/>
    <!-- Glowing Ruby Chaos Fingertips gesturing upward -->
    <rect x="58" y="16" width="14" height="3.5" rx="1.7" fill="#ff4d6d" filter="url(#chaosGlow)"/>

    <!-- Chaos Hex Mandala Rune Circle (Direct Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="8" fill="url(#hexCoreGlow)" filter="url(#chaosGlow)"/>
    <circle cx="65" cy="16" r="3" fill="#ffffff"/>
    <polygon points="65,9 68,13 72,13 69,16 71,20 65,18 59,20 61,16 58,13 62,13" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>

    <!-- 2. FLOWING SCARLET CAPE ON LEFT SIDE -->
    <path d="M 32 68 C 22 72 16 88 18 108 C 24 100 28 88 32 78 Z" fill="url(#tiaraRuby)" stroke="#38000a" stroke-width="1"/>

    <!-- 3. AUBURN HAIR & FLOWING LOCKS -->
    <path d="M 28 50 C 24 34 38 22 58 22 C 78 22 92 34 88 50 C 90 72 94 96 92 116 C 84 108 82 82 80 66 C 72 56 44 56 36 66 C 32 86 30 108 24 116 C 22 96 26 72 28 50 Z" fill="url(#auburnHair)"/>

    <!-- 4. WANDA FACE & HEAD (Looking up toward hex) -->
    <path d="M 38 52 C 38 38 46 32 58 32 C 70 32 78 38 78 52 C 79 66 77 78 72 86 C 67 94 62 96 58 96 C 54 96 49 94 44 86 C 39 78 37 66 38 52 Z" fill="url(#wandaSkin)" stroke="#7a4e40" stroke-width="1.2"/>

    <!-- Glowing Red Chaos Eyes (Looking up) -->
    <ellipse cx="48" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="48" cy="62" r="1.8" fill="#d90429" filter="url(#chaosGlow)"/>
    <circle cx="48" cy="62" r="0.8" fill="#ffffff"/>
    <ellipse cx="66" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="66" cy="62" r="1.8" fill="#d90429" filter="url(#chaosGlow)"/>
    <circle cx="66" cy="62" r="0.8" fill="#ffffff"/>

    <path d="M 58 58 L 56 70 L 60 70" stroke="#7a4e40" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 53 78 Q 58 83 63 78" stroke="#d90429" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- 5. METALLIC RUBY TIARA / CROWN -->
    <path d="M 34 50 L 40 34 L 48 46 L 58 26 L 68 46 L 76 34 L 82 50 C 76 46 68 44 58 44 C 48 44 40 46 34 50 Z" fill="url(#tiaraRuby)" stroke="#38000a" stroke-width="1.3"/>
    <polygon points="58,30 60,38 58,40 56,38" fill="#ffffff" opacity="0.6"/>

    <!-- 6. CHEST & SCULPTED CORSET -->
    <path d="M 28 106 C 18 112 14 128 12 146 C 32 150 82 150 102 146 C 100 128 96 112 88 106 C 78 116 68 120 58 120 C 48 120 38 116 28 106 Z" fill="url(#tiaraRuby)" stroke="#38000a" stroke-width="1.6"/>
    <path d="M 44 116 Q 58 128 72 116" fill="none" stroke="#220005" stroke-width="2"/>
    <line x1="58" y1="120" x2="58" y2="148" stroke="#220005" stroke-width="2"/>
  </g>
</svg>
