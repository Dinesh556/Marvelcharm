<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Realistic Polished Hot-Rod Crimson Armor -->
    <radialGradient id="imCrimson" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff3838"/>
      <stop offset="45%" stop-color="#bd0909"/>
      <stop offset="85%" stop-color="#700000"/>
      <stop offset="100%" stop-color="#3b0000"/>
    </radialGradient>

    <!-- Mark LXXXV Crimson Gradient -->
    <radialGradient id="imCrimson" cx="42%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#ff2e3e"/>
      <stop offset="45%" stop-color="#d11122"/>
      <stop offset="85%" stop-color="#7a030f"/>
      <stop offset="100%" stop-color="#3d0006"/>
    </radialGradient>

    <!-- Champagne Gold Armor Titanium -->
    <linearGradient id="imChampagneGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="35%" stop-color="#f5c760"/>
      <stop offset="75%" stop-color="#c48e24"/>
      <stop offset="100%" stop-color="#704b08"/>
    </linearGradient>

    <!-- Arc Reactor / Repulsor Glow -->
    <radialGradient id="arcReactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#b6f7ff"/>
      <stop offset="70%" stop-color="#2ee4ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </radialGradient>

    <filter id="repulsorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iron3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#iron3DShadow)">
    <!-- 1. RAISED ARMORED ARM & OPEN GAUNTLET PALM AT (cx=65, cy=16) -->
    <!-- Armored Forearm extending from shoulder (x=90, y=56) up to gauntlet (x=65, y=16) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#imCrimson)" stroke="#380000" stroke-width="1.3"/>
    <!-- Champagne Gold Armored Elbow & Forearm Plating -->
    <path d="M 78 34 L 72 26 L 64 30 L 70 42 Z" fill="url(#imChampagneGold)" stroke="#523200" stroke-width="0.9"/>
    <!-- Gold Wrist Bangle -->
    <rect x="58" y="20" width="14" height="4.5" rx="1.5" transform="rotate(-25 65 22)" fill="url(#imChampagneGold)" stroke="#523200" stroke-width="0.8"/>

    <!-- Open Gauntlet Palm Facing Straight Up (Shoots Repulsor Beam into Ceiling!) -->
    <ellipse cx="65" cy="18" rx="12" ry="7" fill="url(#imCrimson)" stroke="#4a0008" stroke-width="1.3"/>
    <!-- Armored Fingers Spread Around Palm Repulsor -->
    <circle cx="53" cy="13" r="2.4" fill="url(#imChampagneGold)"/>
    <circle cx="59" cy="10" r="2.4" fill="url(#imChampagneGold)"/>
    <circle cx="65" cy="9" r="2.5" fill="url(#imChampagneGold)"/>
    <circle cx="71" cy="10" r="2.4" fill="url(#imChampagneGold)"/>
    <circle cx="77" cy="13" r="2.4" fill="url(#imChampagneGold)"/>

    <!-- Glowing Cyan Palm Repulsor Core (Exact Tether Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="7.5" fill="#0b1b24" stroke="url(#imChampagneGold)" stroke-width="1.2"/>
    <circle cx="65" cy="16" r="5.5" fill="url(#arcReactorGlow)" filter="url(#repulsorGlow)"/>
    <circle cx="65" cy="16" r="2.4" fill="#ffffff"/>

    <!-- 2. LEFT ARMORED ARM (Bent defensively at hip) -->
    <path d="M 32 64 L 20 80 L 26 88 L 38 72 Z" fill="url(#imCrimson)" stroke="#380000" stroke-width="1.2"/>
    <circle cx="23" cy="85" r="5" fill="url(#imChampagneGold)" stroke="#523200" stroke-width="1"/>

    <!-- 3. IRON MAN CHEST & ARMORED TORSO -->
    <path d="M 32 60 L 88 56 L 82 110 L 38 110 Z" fill="url(#imCrimson)" stroke="#380000" stroke-width="1.6"/>
    <!-- Gold Chest Flanks -->
    <path d="M 32 60 L 44 60 L 40 108 L 36 108 Z" fill="url(#imChampagneGold)"/>
    <path d="M 88 56 L 76 58 L 78 108 L 82 108 Z" fill="url(#imChampagneGold)"/>

    <!-- Chest Arc Reactor -->
    <circle cx="60" cy="86" r="8.5" fill="#08141e" stroke="url(#imChampagneGold)" stroke-width="1.4"/>
    <circle cx="60" cy="86" r="6" fill="url(#arcReactorGlow)" filter="url(#repulsorGlow)"/>
    <circle cx="60" cy="86" r="2.6" fill="#ffffff"/>

    <!-- 4. IRON MAN HELMET (Tilted looking up towards the repulsor beam) -->
    <path d="M 36 46 C 36 30 48 26 60 26 C 72 26 84 30 84 46 C 85 60 84 74 80 84 C 76 92 68 96 60 96 C 52 96 44 92 40 84 C 36 74 35 60 36 46 Z" fill="url(#imCrimson)" stroke="#380000" stroke-width="1.8"/>

    <!-- Champagne Gold Faceplate -->
    <path d="M 42 48 L 78 48 L 80 64 L 75 78 L 69 88 L 60 90 L 51 88 L 45 78 L 40 64 Z" fill="url(#imChampagneGold)" stroke="#422800" stroke-width="1.4"/>
    <polygon points="44,49 76,49 72,55 48,55" fill="#1b0003"/>
    <!-- Glowing Optical Slits (LED Cyan) -->
    <g filter="url(#repulsorGlow)">
      <polygon points="46,62 56,64 55,67 45,65" fill="url(#arcReactorGlow)" stroke="#00e1ff" stroke-width="0.7"/>
      <polygon points="74,62 64,64 65,67 75,65" fill="url(#arcReactorGlow)" stroke="#00e1ff" stroke-width="0.7"/>
    </g>
    <polygon points="47,63 54,65 53,66 46,64" fill="#ffffff"/>
    <polygon points="73,63 66,65 67,66 74,64" fill="#ffffff"/>

    <!-- Chiseled Jaw -->
    <polygon points="52,80 68,80 65,88 60,90 55,88" fill="#523200"/>

    <!-- 5. WAIST & LEGS (Hovering flight pose) -->
    <path d="M 40 110 L 80 110 L 74 135 L 46 135 Z" fill="url(#imCrimson)" stroke="#380000" stroke-width="1.3"/>
    <path d="M 46 135 L 42 154 L 54 154 L 56 135 Z" fill="url(#imChampagneGold)" stroke="#523200" stroke-width="1"/>
    <path d="M 74 135 L 78 154 L 66 154 L 64 135 Z" fill="url(#imChampagneGold)" stroke="#523200" stroke-width="1"/>
    <!-- Boot Thruster Glows -->
    <ellipse cx="48" cy="155" rx="5" ry="2" fill="url(#arcReactorGlow)" filter="url(#repulsorGlow)"/>
    <ellipse cx="72" cy="155" rx="5" ry="2" fill="url(#arcReactorGlow)" filter="url(#repulsorGlow)"/>
  </g>
</svg>
