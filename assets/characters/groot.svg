<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Bark Texture Gradient -->
    <radialGradient id="grootBark" cx="44%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#996c42"/>
      <stop offset="45%" stop-color="#734d29"/>
      <stop offset="85%" stop-color="#472d14"/>
      <stop offset="100%" stop-color="#241405"/>
    </radialGradient>

    <!-- Warm Amber Eyes -->
    <radialGradient id="grootEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffb703"/>
      <stop offset="75%" stop-color="#b36200"/>
      <stop offset="100%" stop-color="#3d1e00"/>
    </radialGradient>

    <!-- Vibrant Sprout Green -->
    <linearGradient id="grootLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80ff33"/>
      <stop offset="50%" stop-color="#44cc11"/>
      <stop offset="100%" stop-color="#1f7a05"/>
    </linearGradient>

    <filter id="groot3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#groot3DShadow)">
    <!-- 1. RAISED LIVING WOOD BRANCH ARM & HAND AT (cx=65, cy=16) -->
    <!-- Branch Arm extending from shoulder (x=88, y=56) up to hand (x=65, y=22) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#grootBark)" stroke="#241405" stroke-width="1.3"/>
    <!-- Bark Knots and Little Leaf Bud on Arm -->
    <circle cx="74" cy="38" r="3" fill="#54361c" stroke="#241405" stroke-width="0.8"/>
    <path d="M 78 40 C 82 36 86 38 84 43 Z" fill="url(#grootLeaf)"/>

    <!-- Branch Hand clutching living vine at cx=65, cy=22 -->
    <ellipse cx="65" cy="22" rx="9" ry="6.5" fill="url(#grootBark)" stroke="#241405" stroke-width="1.1"/>
    <!-- Curled Wooden Twig Fingers wrapped around vine -->
    <rect x="58" y="16" width="14" height="4" rx="2" fill="#8f633b" stroke="#241405" stroke-width="0.7"/>

    <!-- Sprouting Green Leaves at cx=65, cy=16 merging into vine -->
    <path d="M 65 16 C 60 8 55 9 58 15 Z" fill="url(#grootLeaf)"/>
    <path d="M 65 16 C 70 8 75 9 72 15 Z" fill="url(#grootLeaf)"/>
    <circle cx="65" cy="16" r="3.2" fill="#44cc11" opacity="0.8"/>

    <!-- 2. LEFT BRANCH ARM / SHOULDER -->
    <path d="M 28 80 C 22 84 18 96 16 112 C 22 108 26 98 28 88 Z" fill="url(#grootBark)" stroke="#241405" stroke-width="1"/>

    <!-- 3. GROOT CROWN & WOODGRAIN HEAD (Looking up) -->
    <!-- Woody Crown with Branch Spikes -->
    <path d="M 34 50 L 30 28 L 38 36 L 44 20 L 52 32 L 58 18 L 66 32 L 74 20 L 80 36 L 88 28 L 84 50 C 86 66 84 80 78 90 C 72 98 66 102 58 102 C 50 102 42 98 36 90 C 30 80 32 66 34 50 Z" fill="url(#grootBark)" stroke="#261405" stroke-width="1.8"/>

    <!-- Woodgrain Texture Lines -->
    <g stroke="#38200c" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M 42 42 Q 50 34 58 38"/>
      <path d="M 74 42 Q 66 34 58 38"/>
      <path d="M 44 52 Q 52 48 58 52"/>
      <path d="M 72 52 Q 64 48 58 52"/>
      <line x1="58" y1="44" x2="58" y2="62"/>
    </g>

    <!-- Warm Amber Eyes (Looking up toward leaves) -->
    <circle cx="47" cy="64" r="5" fill="#140b04"/>
    <circle cx="47" cy="63" r="3.8" fill="url(#grootEye)"/>
    <circle cx="47" cy="62" r="1.8" fill="#140b04"/>
    <circle cx="46" cy="61" r="1.1" fill="#ffffff"/>

    <circle cx="69" cy="64" r="5" fill="#140b04"/>
    <circle cx="69" cy="63" r="3.8" fill="url(#grootEye)"/>
    <circle cx="69" cy="62" r="1.8" fill="#140b04"/>
    <circle cx="68" cy="61" r="1.1" fill="#ffffff"/>

    <!-- Friendly Tree Smile -->
    <path d="M 50 82 Q 58 90 66 82" stroke="#241405" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- 4. CHEST & SPROUTING WOOD BARK -->
    <path d="M 28 110 C 16 116 10 132 8 150 C 28 154 88 154 108 150 C 106 132 100 116 88 110 C 78 120 68 124 58 124 C 48 124 38 120 28 110 Z" fill="url(#grootBark)" stroke="#261405" stroke-width="2"/>
    <path d="M 52 128 C 48 122 42 124 44 130 Z" fill="url(#grootLeaf)"/>
    <path d="M 64 132 C 68 126 74 128 72 134 Z" fill="url(#grootLeaf)"/>
  </g>
</svg>
