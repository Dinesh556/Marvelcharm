<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Stealth Strike Navy Ballistic Fabric -->
    <radialGradient id="stealthNavySuit" cx="44%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2c4060"/>
      <stop offset="45%" stop-color="#18273d"/>
      <stop offset="85%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#060a10"/>
    </radialGradient>

    <!-- Muted Matte Silver -->
    <linearGradient id="matteSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="40%" stop-color="#bcc7d4"/>
      <stop offset="80%" stop-color="#7a8794"/>
      <stop offset="100%" stop-color="#4a535c"/>
    </linearGradient>

    <!-- Black Spec-Ops Leather -->
    <linearGradient id="specOpsLeather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="50%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <radialGradient id="capSkinStealth" cx="48%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffe3cb"/>
      <stop offset="45%" stop-color="#f0be97"/>
      <stop offset="80%" stop-color="#c48a60"/>
      <stop offset="100%" stop-color="#7a4b2a"/>
    </radialGradient>

    <filter id="cap3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#cap3DShadow)">
    <!-- 1. RAISED SPEC-OPS ARMORED ARM & TACTICAL GLOVE AT (cx=65, cy=16) -->
    <!-- Arm reaching up from right shoulder (x=88, y=56) to glove (x=65, y=22) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#stealthNavySuit)" stroke="#060a10" stroke-width="1.3"/>
    <rect x="58" y="20" width="14" height="5" rx="1.5" transform="rotate(-25 65 22)" fill="url(#matteSilver)" stroke="#222" stroke-width="0.8"/>

    <!-- Black Spec-Ops Gloved Hand clutching tactical carabiner at cx=65, cy=22 -->
    <ellipse cx="65" cy="22" rx="9" ry="6.5" fill="url(#specOpsLeather)" stroke="#080a0d" stroke-width="1.1"/>
    <!-- Curled fingers gripping clamp -->
    <rect x="58" y="16" width="14" height="4" rx="2" fill="#2d3745" stroke="#080a0d" stroke-width="0.7"/>

    <!-- Matte Silver Tactical Carabiner Clamp (Direct Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="6.5" fill="none" stroke="url(#matteSilver)" stroke-width="2.2"/>
    <rect x="63" y="10" width="4" height="4" fill="#1b232e"/>
    <circle cx="65" cy="16" r="2.2" fill="#ffffff"/>

    <!-- 2. LEFT ARM WITH STEALTH STRIKE SHIELD -->
    <circle cx="28" cy="80" r="16" fill="url(#stealthNavySuit)" stroke="#060a10" stroke-width="1"/>
    <circle cx="28" cy="80" r="12" fill="url(#matteSilver)"/>
    <circle cx="28" cy="80" r="8" fill="url(#stealthNavySuit)"/>
    <circle cx="28" cy="80" r="5" fill="#101926"/>
    <polygon points="28,76 29,79 32,79 29.5,81 30.5,84 28,82.5 25.5,84 26.5,81 24,79 27,79" fill="url(#matteSilver)"/>

    <!-- 3. STEALTH HELMET & COWL (Looking up toward cable grip) -->
    <path d="M 34 50 C 34 34 46 28 58 28 C 70 28 80 34 80 50 C 81 64 80 78 76 86 C 72 94 65 98 58 98 C 51 98 44 94 40 86 C 36 78 35 64 34 50 Z" fill="url(#stealthNavySuit)" stroke="#060a10" stroke-width="1.8"/>

    <!-- Side Muted Silver Wings -->
    <path d="M 36 50 C 28 46 26 38 30 32 C 32 36 34 42 36 48 Z" fill="url(#matteSilver)" opacity="0.85"/>
    <path d="M 78 50 C 86 46 88 38 84 32 C 82 36 80 42 78 48 Z" fill="url(#matteSilver)" opacity="0.85"/>

    <!-- Embossed Silver 'A' on Brow -->
    <text x="58" y="48" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="url(#matteSilver)" text-anchor="middle" stroke="#060a10" stroke-width="0.7">A</text>

    <!-- Face Cutout -->
    <path d="M 40 56 C 40 50 48 50 58 50 C 68 50 74 50 74 56 C 75 66 74 76 70 84 C 66 92 60 94 58 94 C 56 94 50 92 46 84 C 42 76 41 66 40 56 Z" fill="url(#capSkinStealth)" stroke="#542e17" stroke-width="1.2"/>
    <!-- Spec-Ops Chin Strap -->
    <path d="M 42 74 C 44 86 50 94 58 95 C 66 94 72 86 74 74 L 70 74 C 68 83 64 90 58 91 C 52 90 48 83 46 74 Z" fill="#1b232e"/>

    <!-- Heroic Blue Eyes (Looking up) -->
    <ellipse cx="48" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="48" cy="62" r="1.6" fill="#2b6ea8"/>
    <circle cx="48" cy="62" r="0.7" fill="#040910"/>
    <ellipse cx="66" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="66" cy="62" r="1.6" fill="#2b6ea8"/>
    <circle cx="66" cy="62" r="0.7" fill="#040910"/>

    <path d="M 58 58 L 56 70 L 60 70" stroke="#663e23" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <line x1="52" y1="80" x2="64" y2="80" stroke="#452312" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 4. STEALTH STRIKE CHEST (Double silver bars) -->
    <path d="M 28 106 C 18 112 14 128 12 146 C 32 150 82 150 102 146 C 100 128 96 112 88 106 C 78 116 68 120 58 120 C 48 120 38 116 28 106 Z" fill="url(#stealthNavySuit)" stroke="#060a10" stroke-width="1.8"/>

    <!-- Horizontal Silver Strike Bars -->
    <path d="M 22 136 L 46 136 L 46 141 L 20 141 Z" fill="url(#matteSilver)"/>
    <path d="M 70 136 L 94 136 L 96 141 L 70 141 Z" fill="url(#matteSilver)"/>

    <!-- Muted Silver Star Plaque -->
    <circle cx="58" cy="124" r="11" fill="#131e2e" stroke="#33445c" stroke-width="1"/>
    <polygon points="58,116 60.5,121.5 66.5,122 62,125.5 63.5,131.5 58,128 52.5,131.5 54,125.5 49.5,122 55.5,121.5" fill="url(#matteSilver)"/>
  </g>
</svg>
