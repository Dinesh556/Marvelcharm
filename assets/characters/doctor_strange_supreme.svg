<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Dark Sorcerer Robes -->
    <radialGradient id="supremeRobes" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3d1e57"/>
      <stop offset="50%" stop-color="#1f0d2e"/>
      <stop offset="85%" stop-color="#11051a"/>
      <stop offset="100%" stop-color="#07020a"/>
    </radialGradient>

    <radialGradient id="supremeSkin" cx="48%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#f2e2d8"/>
      <stop offset="50%" stop-color="#cfb4a3"/>
      <stop offset="85%" stop-color="#8c6d5b"/>
      <stop offset="100%" stop-color="#452f23"/>
    </radialGradient>

    <linearGradient id="supremeCloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#540819"/>
      <stop offset="45%" stop-color="#2b020a"/>
      <stop offset="100%" stop-color="#0a0002"/>
    </linearGradient>

    <!-- Glowing Third Eye / Dark Mandala -->
    <radialGradient id="thirdEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffbf00"/>
      <stop offset="75%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>

    <filter id="eldritchGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="supreme3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#supreme3DShadow)">
    <!-- 1. RAISED DARK ARM & PALE CLAWED HAND AT (cx=65, cy=16) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#supremeRobes)" stroke="#0a020f" stroke-width="1.3"/>
    <rect x="58" y="20" width="14" height="4.5" rx="1.5" transform="rotate(-25 65 22)" fill="#2b020a" stroke="#d4af37" stroke-width="0.8"/>

    <!-- Pale Clawed Hand at cx=65, cy=22 -->
    <ellipse cx="65" cy="22" rx="9" ry="6.5" fill="url(#supremeSkin)" stroke="#3b2318" stroke-width="1.1"/>
    <rect x="58" y="16" width="14" height="3.5" rx="1.7" fill="#cfb4a3"/>

    <!-- Eldritch Dark Mandala (Direct Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="9" fill="none" stroke="#ab55f2" stroke-width="1.6" filter="url(#eldritchGlow)"/>
    <polygon points="65,8 73,20 57,20" fill="none" stroke="#ff0080" stroke-width="1" filter="url(#eldritchGlow)"/>
    <polygon points="65,24 73,12 57,12" fill="none" stroke="#ff0080" stroke-width="1" filter="url(#eldritchGlow)"/>
    <circle cx="65" cy="16" r="2.8" fill="url(#thirdEyeGlow)"/>

    <!-- 2. HIGH CLOAK WINGS & POPPED COLLAR -->
    <path d="M 24 58 C 12 76 4 112 6 150 C 30 144 44 138 65 140 C 86 138 100 144 124 150 C 126 112 118 76 106 58 Z" fill="url(#supremeCloak)" stroke="#0f0004" stroke-width="1.8"/>
    <path d="M 28 66 L 38 102 L 50 108 L 40 80 Z" fill="#2b020a" stroke="#d4af37" stroke-width="1"/>
    <path d="M 88 66 L 80 102 L 70 108 L 78 80 Z" fill="#2b020a" stroke="#d4af37" stroke-width="1"/>

    <!-- 3. HEAD & THIRD EYE (Looking up toward dark mandala) -->
    <path d="M 34 48 C 32 32 46 26 58 26 C 70 26 80 32 80 48 C 82 62 80 76 76 84 C 74 72 72 58 70 50 C 62 40 48 40 40 50 C 38 58 36 72 34 84 Z" fill="#14171d"/>
    <path d="M 38 50 C 38 36 48 32 58 32 C 68 32 76 36 76 50 C 77 66 75 82 71 90 C 67 98 60 100 58 100 C 55 100 48 98 44 90 C 40 82 38 66 38 50 Z" fill="url(#supremeSkin)" stroke="#3b2318" stroke-width="1.2"/>

    <!-- Third Eye on Forehead -->
    <g filter="url(#eldritchGlow)">
      <path d="M 52 42 Q 58 36 64 42 Q 58 48 52 42 Z" fill="url(#thirdEyeGlow)" stroke="#ffaa00" stroke-width="0.8"/>
      <ellipse cx="58" cy="42" rx="1.5" ry="2.5" fill="#1a0005"/>
    </g>

    <!-- Sinister Yellow Eyes -->
    <ellipse cx="48" cy="62" rx="4" ry="3" fill="#120406"/>
    <circle cx="48" cy="62" r="1.8" fill="#ffb703"/>
    <ellipse cx="66" cy="62" rx="4" ry="3" fill="#120406"/>
    <circle cx="66" cy="62" r="1.8" fill="#ffb703"/>

    <!-- Goatee -->
    <path d="M 54 78 L 62 78 L 58 84 Z" fill="#14171d"/>
    <path d="M 55 87 L 61 87 L 58 96 Z" fill="#14171d"/>
    <line x1="52" y1="81" x2="64" y2="81" stroke="#381c10" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 4. ROBES & CORRUPTED AMULET -->
    <path d="M 28 106 C 20 114 16 130 14 148 C 34 152 82 152 102 148 C 100 130 96 114 88 106 C 78 116 68 120 58 120 C 48 120 38 116 28 106 Z" fill="url(#supremeRobes)" stroke="#0a020f" stroke-width="1.8"/>
    <ellipse cx="58" cy="120" rx="9" ry="6.5" fill="#11051a" stroke="#d4af37" stroke-width="1.4"/>
    <ellipse cx="58" cy="120" rx="5" ry="3.5" fill="url(#thirdEyeGlow)" filter="url(#eldritchGlow)"/>
  </g>
</svg>
