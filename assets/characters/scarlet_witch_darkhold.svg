<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <!-- Obsidian Crown -->
    <linearGradient id="obsidianCrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#401824"/>
      <stop offset="45%" stop-color="#1c050c"/>
      <stop offset="85%" stop-color="#0d0004"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Shadow Crimson Robes -->
    <radialGradient id="darkholdRobes" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5e0b1c"/>
      <stop offset="45%" stop-color="#36030e"/>
      <stop offset="80%" stop-color="#170105"/>
      <stop offset="100%" stop-color="#050001"/>
    </radialGradient>

    <radialGradient id="darkholdSkin" cx="48%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#fcedeb"/>
      <stop offset="50%" stop-color="#e8bfbe"/>
      <stop offset="85%" stop-color="#ab7778"/>
      <stop offset="100%" stop-color="#5e3335"/>
    </radialGradient>

    <radialGradient id="chaosHexEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ff1744"/>
      <stop offset="80%" stop-color="#b00020"/>
      <stop offset="100%" stop-color="#4a000c"/>
    </radialGradient>

    <filter id="darkChaosGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="darkhold3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#darkhold3DShadow)">
    <!-- 1. RAISED CORRUPTED ARM & BLACKENED FINGERTIPS AT (cx=65, cy=16) -->
    <!-- Dark Robe Sleeve extending from shoulder (x=88, y=56) up to wrist (x=65, y=24) -->
    <path d="M 88 56 L 76 30 L 66 22 L 58 26 L 68 44 L 80 62 Z" fill="url(#darkholdRobes)" stroke="#050001" stroke-width="1.3"/>
    <rect x="58" y="20" width="14" height="4.5" rx="1.5" transform="rotate(-25 65 22)" fill="#2e050f" stroke="#000" stroke-width="0.8"/>

    <!-- Corrupted Pale Mudra Hand at cx=65, cy=22 -->
    <ellipse cx="65" cy="22" rx="8" ry="6" fill="url(#darkholdSkin)" stroke="#5e3335" stroke-width="1"/>
    <!-- Blackened corrupt fingertips channeling eldritch chaos -->
    <rect x="58" y="16" width="14" height="3.5" rx="1.7" fill="#140003" stroke="#ff1744" stroke-width="0.7"/>

    <!-- Corrupted Darkhold Hex Mandala Rune Circle (Direct Connection at cx=65, cy=16) -->
    <circle cx="65" cy="16" r="8" fill="url(#chaosHexEyeGlow)" filter="url(#darkChaosGlow)"/>
    <circle cx="65" cy="16" r="2.5" fill="#ffffff"/>
    <polygon points="65,9 68,13 72,13 69,16 71,20 65,18 59,20 61,16 58,13 62,13" fill="none" stroke="#ff1744" stroke-width="0.8" opacity="0.9"/>

    <!-- 2. TATTERED DARK CAPE ON LEFT SIDE -->
    <path d="M 32 68 C 22 72 16 88 18 108 C 24 100 28 88 32 78 Z" fill="url(#darkholdRobes)" stroke="#050001" stroke-width="1"/>

    <!-- 3. RAVEN BLACK HAIR WITH DARK RED TINTS -->
    <path d="M 28 50 C 24 34 38 22 58 22 C 78 22 92 34 88 50 C 90 72 94 96 92 116 C 84 108 82 82 80 66 C 72 56 44 56 36 66 C 32 86 30 108 24 116 C 22 96 26 72 28 50 Z" fill="#140402"/>

    <!-- 4. PALE CORRUPTED FACE (Looking up) -->
    <path d="M 38 52 C 38 38 46 32 58 32 C 70 32 78 38 78 52 C 79 66 77 78 72 86 C 67 94 62 96 58 96 C 54 96 49 94 44 86 C 39 78 37 66 38 52 Z" fill="url(#darkholdSkin)" stroke="#5e3335" stroke-width="1.2"/>

    <!-- Darkhold Veins on Cheek -->
    <path d="M 44 68 Q 47 74 45 80" stroke="#4a000c" stroke-width="0.8" fill="none"/>
    <path d="M 70 70 Q 68 76 71 82" stroke="#4a000c" stroke-width="0.8" fill="none"/>

    <!-- Glowing Red Sinister Chaos Eyes -->
    <ellipse cx="48" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="48" cy="62" r="1.8" fill="#ff1744" filter="url(#darkChaosGlow)"/>
    <circle cx="48" cy="62" r="0.8" fill="#ffffff"/>
    <ellipse cx="66" cy="62" rx="3.8" ry="2.6" fill="#ffffff"/>
    <circle cx="66" cy="62" r="1.8" fill="#ff1744" filter="url(#darkChaosGlow)"/>
    <circle cx="66" cy="62" r="0.8" fill="#ffffff"/>

    <path d="M 58 58 L 56 70 L 60 70" stroke="#5e3335" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 53 79 Q 58 75 63 79" stroke="#36030e" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- 5. OBSIDIAN CRACKED TIARA -->
    <path d="M 34 50 L 40 34 L 48 46 L 58 26 L 68 46 L 76 34 L 82 50 C 76 46 68 44 58 44 C 48 44 40 46 34 50 Z" fill="url(#obsidianCrown)" stroke="#000000" stroke-width="1.5"/>
    <path d="M 58 32 L 60 38 L 57 41 L 59 44" stroke="#ff1744" stroke-width="0.8" fill="none"/>

    <!-- 6. CORRUPTED BODICE -->
    <path d="M 28 106 C 18 112 14 128 12 146 C 32 150 82 150 102 146 C 100 128 96 112 88 106 C 78 116 68 120 58 120 C 48 120 38 116 28 106 Z" fill="url(#darkholdRobes)" stroke="#050001" stroke-width="1.6"/>
    <path d="M 44 116 Q 58 128 72 116" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="58" y1="120" x2="58" y2="148" stroke="#000" stroke-width="2"/>
  </g>
</svg>
